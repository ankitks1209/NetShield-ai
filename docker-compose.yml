
version: '3.8'

services:
  backend:
    build: ./backend
    network_mode: "host"
    environment:
      - MONGO_URI=${MONGO_URI}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - mongodb
      - postgres
    restart: always

  frontend:
    build: ./Frontend
    ports:
      - "5173:80"
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=netshield_db
    ports:
      - "5432:5432"
    restart: always
